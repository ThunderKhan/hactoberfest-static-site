name: Performance Audit (temporary)

on:
  push:
    branches:
      - perf-audit/measure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Lighthouse
        run: |
          npx --yes lighthouse@latest http://127.0.0.1:4173 \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=/tmp/lighthouse.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"

      - name: Report bundle and Lighthouse metrics
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/lighthouse.json", "utf8"));
          const a = report.audits;
          const score = name => Math.round((report.categories[name].score ?? 0) * 100);
          const ms = id => a[id]?.numericValue;
          console.log(JSON.stringify({
            scores: {
              performance: score("performance"),
              accessibility: score("accessibility"),
              bestPractices: score("best-practices"),
              seo: score("seo")
            },
            metrics: {
              fcpMs: ms("first-contentful-paint"),
              lcpMs: ms("largest-contentful-paint"),
              cls: ms("cumulative-layout-shift"),
              tbtMs: ms("total-blocking-time"),
              speedIndexMs: ms("speed-index"),
              ttiMs: ms("interactive")
            },
            warnings: {
              renderBlockingResources: a["render-blocking-resources"]?.details?.items?.length ?? null,
              unusedCssBytes: a["unused-css-rules"]?.details?.overallSavingsBytes ?? null,
              unusedJsBytes: a["unused-javascript"]?.details?.overallSavingsBytes ?? null,
              networkRequests: report.audits["network-requests"]?.details?.items?.length ?? null,
              totalByteWeight: a["total-byte-weight"]?.numericValue ?? null
            }
          }, null, 2));
          NODE

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lighthouse.json
